name: Release

# Bump version in pyproject.toml, commit, then push a matching tag:
#   git tag v1.1.0 && git push origin v1.1.0
# Pre-releases: version = "0.1.0rc1" in pyproject.toml, tag v0.1.0-rc1.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  macos:
    needs: test
    # Built on macOS 26, the oldest supported version, so it also runs on macOS 27.
    runs-on: macos-26
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        id: python
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"

      - name: Check tag matches version
        id: version
        # Compared as PEP 440 versions, so the tag v0.1.0-rc1 matches version 0.1.0rc1.
        run: |
          .venv/bin/python - <<'PY'
          import os, sys, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not tag.startswith("v") or Version(tag[1:]) != Version(version):
              sys.exit(f"::error::Tag {tag} does not match version {version} in pyproject.toml")
          # Alphas, betas and release candidates (v0.1.0-rc1, v1.0.0b2, ...) are marked as pre-releases.
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"prerelease={'--prerelease' if Version(version).is_prerelease else ''}", file=out)
          PY

      - name: Build
        run: PYTHON_VERSION="${{ steps.python.outputs.python-path }}" ./build.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-dmg
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install flatpak-builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 keeps bubblewrap from creating the build sandbox otherwise.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build
        run: ./build-linux.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.macos.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.flatpak --title "Call Switcher $GITHUB_REF_NAME" --generate-notes $PRERELEASE
