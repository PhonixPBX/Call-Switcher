name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26
            runner: macos-26
            preview: false
          # macOS 27 is only available as the "xcode-27" public preview image so far.
          - name: macOS 27
            runner: xcode-27
            preview: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        id: python
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"

      - name: Run tests
        run: .venv/bin/python -m pytest -v

      - name: Build app
        run: PYTHON_VERSION="${{ steps.python.outputs.python-path }}" ./build.sh

      - name: Check bundle
        run: |
          APP="dist/Call Switcher.app"
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes json -o - "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          # The bundle must not depend on libraries outside of it (e.g. Homebrew).
          ! find "$APP" -type f \( -name "*.so" -o -name "*.dylib" \) -print0 \
            | xargs -0 otool -L | grep -E "/opt/homebrew|/usr/local"

      - name: Launch app
        run: |
          # py2app reports missing modules only at launch, with a "Launch error" dialog.
          "dist/Call Switcher.app/Contents/MacOS/Call Switcher" > launch.log 2>&1 &
          sleep 10
          kill $! || true
          cat launch.log
          ! grep -E "Launch error|Traceback" launch.log

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CallSwitcher-${{ matrix.runner }}
          path: dist/*.dmg
          archive: false  # downloadable as the DMG itself, not zipped
          if-no-files-found: error

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        id: python
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"

      - name: Check Flatpak requirements match uv.lock
        run: |
          .venv/bin/python packaging/linux/requirements.py
          git diff --exit-code packaging/linux/python3-requirements.json

      - name: Run tests
        run: .venv/bin/python -m pytest -v
        env:
          QT_QPA_PLATFORM: offscreen

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install flatpak-builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          # Ubuntu 24.04 keeps bubblewrap from creating the build sandbox otherwise.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Check desktop file and metadata
        run: |
          desktop-file-validate packaging/linux/org.phonixpbx.callswitcher.desktop
          appstreamcli validate --no-net packaging/linux/org.phonixpbx.callswitcher.metainfo.xml

      - name: Build
        run: ./build-linux.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CallSwitcher-flatpak
          path: dist/*.flatpak
          archive: false
          if-no-files-found: error

  windows:
    name: Test and build (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        id: python
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"

      - name: Run tests
        run: .venv\Scripts\python -m pytest -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build
        run: .\build-windows.ps1 -Python "${{ steps.python.outputs.python-path }}"

      - name: Launch app
        # A windowed PyInstaller app shows startup errors in a dialog and waits. Without a tray
        # (offscreen), the app quits on its own once it is idle, so a hang means it failed.
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process -FilePath "dist\Call Switcher\Call Switcher.exe" -ArgumentList "--background" -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "Call Switcher did not quit (startup error?)" }
          if ($app.ExitCode -ne 0) { throw "Call Switcher exited with $($app.ExitCode)" }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CallSwitcher-windows
          path: dist/*-setup.exe
          archive: false
          if-no-files-found: error
